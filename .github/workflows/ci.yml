name: EXC CI
on:
  push:
    branches: ["main", "master/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependency graph
        run: npm ci --ignore-scripts
      - name: Validate, test and create static artifact
        run: npm run build
